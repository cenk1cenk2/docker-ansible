---
stages:
  - container
  - post

variables:
  CONTAINER_IMAGE_NAME: cenk1cenk2/ansible-core
  CONTAINER_IMAGE_TAGS: latest
  CONTAINER_IMAGE_BUILD_ARGS: |
    PYTHON_VERSION: 3.12-slim
    ANSIBLE_VERSION: 11.3.0
  README_DESCRIPTION: |
    Run Ansible in Docker.

include:
  - project: devops/pipelines
    ref: buildah@2.0.0
    file:
      - /buildah/build.gitlab-ci.yml
      - /buildah/registry-dockerhub.gitlab-ci.yml

  - project: devops/pipelines
    ref: docker@1.1.0
    file:
      - /docker/update-docker-hub-readme.gitlab-ci.yml

container-build:
  stage: container
  extends: .container-build
  variables:
    CONTAINER_FILE_NAME: Dockerfile
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

update-docker-hub-readme:
  stage: post
  extends: .update-docker-hub-readme
  dependencies: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
    - if: $CI_COMMIT_TAG
      when: on_success
    - when: never
